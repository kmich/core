# A NATS server for a two-node cluster, as the cluster README describes it:
# one account for the cluster, one user per node. Each node may publish only
# its own RPC, event and member subjects, and receives only its own RPCs and
# its own inbox. The "admin" user is for the tests' clean-up (and operators);
# no node uses it. A node may use the JetStream API only for the three KV
# streams, and answers each call it receives once.
#
#   docker run -d -p 4222:4222 -v $PWD/nats-permissions.conf:/etc/nats/cluster.conf:ro
#     nats:2.15.3-alpine -c /etc/nats/cluster.conf
jetstream {
  store_dir: /data
}

accounts {
  HASS: {
    jetstream: enabled
    users: [
      { user: admin, password: secret_admin }
      {
        user: node_a
        password: secret_a
        permissions: {
          publish: {
            allow: [
              "hass.rpc.*.from.node_a",
              "hass.event.node_a",
              "$KV.hass_leases._leader",
              "$KV.hass_leases._node.node_a",
              "$KV.hass_states.>",
              "$KV.hass_storage.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.KV_hass_states",
              "$JS.API.STREAM.INFO.KV_hass_leases",
              "$JS.API.STREAM.INFO.KV_hass_storage",
              "$JS.API.STREAM.CREATE.KV_hass_states",
              "$JS.API.STREAM.CREATE.KV_hass_leases",
              "$JS.API.STREAM.CREATE.KV_hass_storage",
              "$JS.API.STREAM.MSG.GET.KV_hass_states",
              "$JS.API.STREAM.MSG.GET.KV_hass_leases",
              "$JS.API.STREAM.MSG.GET.KV_hass_storage",
              "$JS.API.DIRECT.GET.KV_hass_states.>",
              "$JS.API.DIRECT.GET.KV_hass_leases.>",
              "$JS.API.DIRECT.GET.KV_hass_storage.>",
              "$JS.API.CONSUMER.CREATE.KV_hass_states",
              "$JS.API.CONSUMER.CREATE.KV_hass_states.>",
              "$JS.API.CONSUMER.CREATE.KV_hass_leases",
              "$JS.API.CONSUMER.CREATE.KV_hass_leases.>",
              "$JS.API.CONSUMER.CREATE.KV_hass_storage",
              "$JS.API.CONSUMER.CREATE.KV_hass_storage.>",
              "$JS.API.CONSUMER.DELETE.KV_hass_states.*",
              "$JS.API.CONSUMER.DELETE.KV_hass_leases.*",
              "$JS.API.CONSUMER.DELETE.KV_hass_storage.*",
              "$JS.API.CONSUMER.INFO.KV_hass_states.*",
              "$JS.API.CONSUMER.INFO.KV_hass_leases.*",
              "$JS.API.CONSUMER.INFO.KV_hass_storage.*",
              "$JS.API.STREAM.NAMES",
              "$JS.ACK.>",
              "$JS.FC.>"
            ]
          }
          subscribe: {
            allow: ["hass.rpc.node_a.from.*", "hass.event.*", "_INBOX.node_a.>"]
          }
          allow_responses: { max: 1, expires: "1m" }
        }
      }
      {
        user: node_b
        password: secret_b
        permissions: {
          publish: {
            allow: [
              "hass.rpc.*.from.node_b",
              "hass.event.node_b",
              "$KV.hass_leases._leader",
              "$KV.hass_leases._node.node_b",
              "$KV.hass_states.>",
              "$KV.hass_storage.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.KV_hass_states",
              "$JS.API.STREAM.INFO.KV_hass_leases",
              "$JS.API.STREAM.INFO.KV_hass_storage",
              "$JS.API.STREAM.CREATE.KV_hass_states",
              "$JS.API.STREAM.CREATE.KV_hass_leases",
              "$JS.API.STREAM.CREATE.KV_hass_storage",
              "$JS.API.STREAM.MSG.GET.KV_hass_states",
              "$JS.API.STREAM.MSG.GET.KV_hass_leases",
              "$JS.API.STREAM.MSG.GET.KV_hass_storage",
              "$JS.API.DIRECT.GET.KV_hass_states.>",
              "$JS.API.DIRECT.GET.KV_hass_leases.>",
              "$JS.API.DIRECT.GET.KV_hass_storage.>",
              "$JS.API.CONSUMER.CREATE.KV_hass_states",
              "$JS.API.CONSUMER.CREATE.KV_hass_states.>",
              "$JS.API.CONSUMER.CREATE.KV_hass_leases",
              "$JS.API.CONSUMER.CREATE.KV_hass_leases.>",
              "$JS.API.CONSUMER.CREATE.KV_hass_storage",
              "$JS.API.CONSUMER.CREATE.KV_hass_storage.>",
              "$JS.API.CONSUMER.DELETE.KV_hass_states.*",
              "$JS.API.CONSUMER.DELETE.KV_hass_leases.*",
              "$JS.API.CONSUMER.DELETE.KV_hass_storage.*",
              "$JS.API.CONSUMER.INFO.KV_hass_states.*",
              "$JS.API.CONSUMER.INFO.KV_hass_leases.*",
              "$JS.API.CONSUMER.INFO.KV_hass_storage.*",
              "$JS.API.STREAM.NAMES",
              "$JS.ACK.>",
              "$JS.FC.>"
            ]
          }
          subscribe: {
            allow: ["hass.rpc.node_b.from.*", "hass.event.*", "_INBOX.node_b.>"]
          }
          allow_responses: { max: 1, expires: "1m" }
        }
      }
    ]
  }
}
